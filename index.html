<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, accessible kanban-style task manager built with vanilla HTML, CSS and JavaScript.">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">

  <!--
    Apply the saved (or system-preferred) theme BEFORE the page is drawn.
    If we waited for app.js to load, the page could briefly "flash" in the wrong theme.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('task-manager.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <!-- type="module" lets us use import/export. Modules are deferred automatically. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Lets keyboard users jump straight past the header and form. -->
  <a class="skip-link" href="#board">Skip to tasks</a>

  <header class="app-header">
    <div class="container header-inner">
      <h1 class="logo"><span class="logo-mark" aria-hidden="true">✓</span> Task Manager</h1>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark theme">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- ===== Add task form ===== -->
    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading" class="visually-hidden">Add a task</h2>
      <form id="task-form" class="task-form" novalidate>
        <div class="field field-title">
          <label for="task-title">Task</label>
          <input id="task-title" name="title" type="text" placeholder="What needs to be done?"
                 maxlength="120" autocomplete="off" required aria-describedby="form-error">
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="task-due">Due date</label>
          <input id="task-due" name="dueDate" type="date">
        </div>
        <button type="submit" class="btn btn-primary">Add task</button>
      </form>
      <p id="form-error" class="form-error" role="alert"></p>
    </section>

    <!-- ===== Search and filters ===== -->
    <section class="toolbar" aria-label="Search and filter tasks">
      <div class="search-field">
        <label for="search" class="visually-hidden">Search tasks</label>
        <input id="search" type="search" placeholder="Search tasks…  (press / to focus)" autocomplete="off">
      </div>
      <div class="filters" role="group" aria-label="Show tasks">
        <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button id="clear-completed" type="button" class="btn btn-ghost">Clear completed</button>
    </section>

    <!-- ===== Kanban board ===== -->
    <section id="board" class="board" aria-label="Task board" tabindex="-1">
      <div class="column">
        <header class="column-header">
          <h2 id="col-todo">To do</h2>
          <span class="count" data-count="todo" aria-label="tasks">0</span>
        </header>
        <ul class="task-list" data-status="todo" aria-labelledby="col-todo" data-empty="No tasks here yet"></ul>
      </div>
      <div class="column">
        <header class="column-header">
          <h2 id="col-in-progress">In progress</h2>
          <span class="count" data-count="in-progress" aria-label="tasks">0</span>
        </header>
        <ul class="task-list" data-status="in-progress" aria-labelledby="col-in-progress" data-empty="Drag a task here to start it"></ul>
      </div>
      <div class="column">
        <header class="column-header">
          <h2 id="col-done">Done</h2>
          <span class="count" data-count="done" aria-label="tasks">0</span>
        </header>
        <ul class="task-list" data-status="done" aria-labelledby="col-done" data-empty="Finished tasks land here"></ul>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>Built with vanilla JavaScript by <a href="https://github.com/benjamin26886">Nicholas</a>. Your tasks are saved in this browser only.</p>
    </div>
  </footer>

  <!-- ===== Edit task dialog (native <dialog> gives us focus trapping and Esc-to-close for free) ===== -->
  <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" class="edit-form" novalidate>
      <h2 id="edit-heading">Edit task</h2>
      <div class="field">
        <label for="edit-title">Task</label>
        <input id="edit-title" name="title" type="text" maxlength="120" autocomplete="off" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="edit-priority">Priority</label>
          <select id="edit-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="edit-due">Due date</label>
          <input id="edit-due" name="dueDate" type="date">
        </div>
      </div>
      <div class="field">
        <label for="edit-status">Status</label>
        <select id="edit-status" name="status">
          <option value="todo">To do</option>
          <option value="in-progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <p id="edit-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-close-dialog>Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <!-- Screen readers read out anything we put in here (e.g. "Task moved to Done"). -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
